name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
          VITE_ADMIN_DRIVE_ROOT_URL: ${{ secrets.VITE_ADMIN_DRIVE_ROOT_URL }}
          VITE_ADMIN_HOME_SHEET_URL: ${{ secrets.VITE_ADMIN_HOME_SHEET_URL }}
          VITE_ADMIN_CONTACT_SHEET_URL: ${{ secrets.VITE_ADMIN_CONTACT_SHEET_URL }}
          VITE_ADMIN_EVENTS_FOLDER_URL: ${{ secrets.VITE_ADMIN_EVENTS_FOLDER_URL }}
          VITE_ADMIN_GALLERY_FOLDER_URL: ${{ secrets.VITE_ADMIN_GALLERY_FOLDER_URL }}
          VITE_ADMIN_APPS_SCRIPT_URL: ${{ secrets.VITE_ADMIN_APPS_SCRIPT_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          enablement: true
